# Gladiator — Layer 1 配置
# 说明：所有键都带默认值，缺失不会导致启动失败。

bridge:
  # 仅监听回环地址。切勿改为 0.0.0.0。
  host: 127.0.0.1
  port: 8765
  # 运行时连接时必须在 HELLO 中携带此 token；留空表示不校验（仅限本机调试）。
  token: ""
  # 心跳超时（秒），超时判定会话死亡并回收 BotHandle
  heartbeat-timeout-seconds: 30
  # spawnBot 后等待运行时登录完成的最长秒数；超时派发 GladiatorBotFailedEvent(TIMEOUT)
  spawn-timeout-seconds: 30

training:
  # 单 bot 每秒允许的动作数上限，超出丢弃并计数
  max-actions-per-second: 10
  # 观测采样频率（Hz）
  observation-hz: 5
  # 空闲判定：连续无动作且无对局事件超过该秒数后下发 IDLE
  idle-after-seconds: 15

spawn:
  # runtime = 外部 mineflayer 运行时（默认，走通道 A 真实登录）
  # golem   = 进程内 NMS 身体（需要 Golem 插件；不登录、不依赖 bot-runtime）
  # golem 缺失时插件仍会启用，但 spawnBot 会返回"未检测到 Golem"的中文错误。
  mode: runtime
  golem:
    # 身体生成世界；留空取第一个世界
    world: ""
    # 生成坐标 x,y,z；留空取该世界的出生点
    location: ""
    # 死亡后多少 tick 复活（golem 侧 DeathPolicy.RESPAWN 的延迟）；默认 40 = 2 秒
    respawn-delay-ticks: 40

worldguard:
  # 未安装 WorldGuard 时是否允许降级运行（全部判定为允许）
  allow-degraded: true

guard:
  # 观测式 deny 反馈（A3）：不查任何外部插件 API，只看「别的插件是否取消了 Bot 的动作」。
  # 任何插件取消了 Bot 的攻击/交互，就记一次 deny，并在下面两个键的窗口内直接判 deny。
  # 观测记录有效期（秒）：过期后 queryPvp 恢复走 WorldGuard / 降级判定
  observed-ttl-seconds: 60
  # 观测记录的作用半径（格）：观测点周围这个范围内都判 deny
  observed-radius: 8.0

# 只读观战：玩家可用 /gladiator spectate [bot] 切旁观者模式观看 Bot 训练。
# 观战者无法攻击/破坏方块；训练环境只把参赛 Bot 当目标，不会追观战者。
spectate:
  enabled: true
