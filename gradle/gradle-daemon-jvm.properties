# Gradle Daemon JVM criteria (Gradle 8.8+, IntelliJ IDEA 2025.1+ 自动读取)。
# Gradle 8.10.2 支持的最高 Gradle JVM 为 23；Java 25 会在编译 build.gradle 时抛
# "Unsupported class file major version 69"。此文件把 daemon 固定到 JDK 17，
# 与「Java 8 toolchain 编译」解耦。换机器时只要有任一 JDK 17 即可，无需改 IDE 设置。
# 官方说明：https://docs.gradle.org/8.10.2/userguide/gradle_daemon.html#sec:daemon_jvm_criteria
toolchainVersion=17
