name: Gladiator
main: top.cnolm.gladiator.GladiatorMain
version: ${version}
author: cnolm
description: AI bot orchestration and training framework (Layer 1)
# Golem 是可选依赖：仅 spawn.mode=golem 时需要。绝不能写成 depend，
# 否则没装 Golem 的服务器会直接跳过 Gladiator 的加载。
softdepend: [WorldGuard, Golem]
commands:
  gladiator:
    description: Gladiator 管理命令
    usage: /gladiator <status|spawn|train|list|game|analyze|pvp|spectate|unspectate|reload>
    aliases: [gl]
    permission: gladiator.admin
permissions:
  gladiator.admin:
    description: 管理 Gladiator 运行时
    default: op
  gladiator.spectate:
    description: 只读观战 Bot 训练（旁观者模式）
    default: op
